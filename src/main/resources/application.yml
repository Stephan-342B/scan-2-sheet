spring:
  batch:
    jdbc:
      # Let Spring create the BATCH_* metadata tables in the embedded (H2) datasource each run.
      initialize-schema: always

logging:
  pattern:
    # Clean, message-only console so the narrative reads like the progress block.
    # %highlight leaves INFO uncoloured and makes WARN/ERROR stand out (red) on a terminal.
    console: "%highlight(%msg%n)"
  level:
    # Quiet framework chatter so the custom job -> step -> file narrative reads cleanly.
    org.springframework.batch: WARN
    org.springframework.jdbc: WARN
    org.springframework.integration: WARN
    com.zaxxer.hikari: WARN

application:
  batch:
    chunk-size: 1
  background-task:
    core-pool-size: 4
    queue-capacity: 15
    thread-name-prefix: s2s
  dir:
    source: /home/stephan/Scan2Sheet/data/source
    archive: /home/stephan/Scan2Sheet/data/archive
    output: /home/stephan/Scan2Sheet/data/output
  file:
    allowed-ext: TIFF,JPEG,GIF,PNG,BMP
    reader:
      limit: NONE
    writer:
      writing-mode: GOOGLE_SHEET
      chunk-size: 100
  table:
    row:
      header-present: true
      select: 1-3,7,1000
#      select: NONE
      max-count: 1000
    col:
      select: 9-11,16
#      select: NONE

